steps:
  - name: 'python:3.11'
    entrypoint: pip
    args: ['install', '-r', 'requirements.txt']
  - name: 'python:3.11'
    entrypoint: pytest
    args: ['test_agent.py']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/hca-digital-front-door:latest', '.']
images:
  - 'gcr.io/$PROJECT_ID/hca-digital-front-door:latest'
